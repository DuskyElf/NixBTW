[package]
name = "dots"
version = "0.1.0"
edition = "2021"
description = "Audited system/home rebuilds for the dotfiles repo"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
strip = true
