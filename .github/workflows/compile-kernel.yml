name: "Compile Optimized Kernel"

# Builds the tuned kernels this repo ships on a standard runner and serves them
# as one signed Nix binary cache, so nixos-rebuild substitutes instead of
# compiling. Two hosts, one job each, one site. The site is not exclusively
# the kernels': compile-hermes.yml publishes the Hermes agent's closure to the
# same URL, which is why the deploy lives in publish-cache.yml and both
# workflows hold the same deploy lock:
#
#   asus     the laptop's kernel (hosts/asus/system.nix), tagged kernel-<ver>
#   homelab  the server's kernel (hosts/homelab/kernel.nix), tagged
#            kernel-homelab-<ver>
#
# The tag prefixes are asymmetric on purpose. The laptop's releases are already
# published as kernel-<ver> with absolute asset URLs on gh-pages, and renaming
# them would make the plan step rebuild a kernel nobody changed. A new host
# takes a prefixed tag instead, and every tag filter below is host-scoped:
# `^kernel-[0-9]` cannot match `kernel-homelab-6.18.64` because a version starts
# with a digit.
#
# Two jobs, not one: the builds are independent (a matrix leg), but there is one
# gh-pages branch, and two legs deploying it with keep_files: false would race
# and the loser's site would drop the winner's narinfos. So the legs upload
# release assets and the publish job rebuilds the whole site from every release
# that survives. The price is that a newly built kernel only becomes
# substitutable when both legs finish; for a daily timer that is a delay, not a
# problem.
#
# Two storages, because the pieces have different size limits. A substituter
# must serve <cache>/<storehash>.narinfo from a fixed path prefix, which only a
# static site can do, but no git branch accepts a file over 100 MB and the nars
# run from 64 KB to 150 MB:
#
#   gh-pages holds the narinfos, a few KB each. Every URL line is rewritten to
#   an absolute release URL.
#
#   GitHub releases hold the nars, as assets under the tag. Assets allow 2 GB
#   per file and are free on public repos. Nix follows the redirect to the
#   storage backend.
#
# A kernel's four outputs are published, out, modules, dev and configfile, plus
# the laptop's nvidia module built against that kernel. The rest of the closure
# is the compiler toolchain the kernel's dev output points at, and
# cache.nixos.org already has all of it, so publishing it again would double the
# download and leave unsigned narinfos in a cache these hosts trust. The build
# checks every reference against upstream instead, so a rev that ships one
# upstream lacks fails here, not on a machine.
#
# The driver module is published because nothing upstream can ever hold it: it
# compiles against this kernel's dev output, which exists only after this run
# builds it, and the laptop pins a driver release newer than nixpkgs knows.
# Leaving it out made it the one thing a kernel bump still compiled on the
# laptop, during the switch, and the only compile that could fail after the
# merge. Built here, a driver that no longer knows the kernel is a red run at
# merge time instead of a failed switch.
#
# A kernel is built at most once. The release carries a PACKAGED manifest,
# uploaded last, and the plan step compares it against every path this leg would
# publish before spending two hours. So dispatching this against a published
# kernel is a two minute no-op, which is also how to rehearse a change to this
# file: plan, gather, deploy and verify run, nothing compiles. Adding a path to
# the list, as the driver module did, makes that comparison fail and republishes
# the release with it, which costs a full kernel build again: the runner starts
# with an empty store and substitutes nothing, not even from this cache.
#
# Retention keeps the newest KEEP_KERNELS releases *per host*. Deleting a
# release whose kernel a generation still runs turns that rollback into a local
# build, so the default leaves one spare; set it to 1 if you never roll back.
# Pruning never touches the release the run published, and a leg only ever
# prunes its own prefix.
#
# Which kernel a host gets is decided in its own file, never named here:
# hosts/asus/stable-kernel.nix picks the newest series with a stable patch
# release out of the pinned toolchain, and hosts/homelab/kernel.nix names the
# LTS series it wants.
#
# Two things make the artifacts identical on the runner and on the machine, so
# the store paths match and the cache hits: a fixed -march in a patch (never
# X86_NATIVE_CPU, which sniffs the build host) and nixpkgs-fast-release pinned by
# rev in flake.nix. The driver module inherits both: it is a fixed-output fetch
# of an upstream tag compiled by the kernel's own build system, and its output
# references nothing but itself.

env:
  CACHE_URL: https://duskyelf.github.io/NixBTW
  RELEASE_REPO: DuskyElf/NixBTW
  # The signer name. The hosts hold the public half they trust; the name there
  # and here must be identical, so keep it in one place each. It says "i9"
  # because the laptop came first: nix matches the name and verifies the key
  # bytes, so an A10 trusting this key is not a mismatch.
  CACHE_KEY_NAME: i9-kernel-cache
  # Kernel releases to keep, per host. Each one is ~305 MB of kernel assets
  # plus, on the laptop, the driver module.
  KEEP_KERNELS: 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      # The selectors: editing either host's kernel changes what is built, so
      # it has to trigger a rebuild or that machine compiles the new one
      # locally.
      - "hosts/asus/**"
      - "hosts/homelab/**"
      - "lib/**"
      - "base/core.nix"
      - "base/workstation.nix"
      - ".github/kernel-asserts/**"
      - ".github/workflows/compile-kernel.yml"
      # The deploy this pipeline calls. Editing it is a reason to rehearse the
      # deploy against a real release, even when no kernel compiles.
      - ".github/workflows/publish-cache.yml"

permissions:
  contents: write

# Concurrency lives on the job, not the workflow: a group per host means two
# quick commits only ever build the newer kernel of *that* host, and a homelab
# push cannot cancel an asus build an hour in (a workflow-level group would).
# The publish job gets its own group because there is one gh-pages branch, and
# that group is `cache-publish`: compile-hermes.yml deploys the same branch and
# waits on the same lock.

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: compile-kernel-${{ matrix.host }}
      cancel-in-progress: true
    strategy:
      # One host's kernel failing to build must not cancel the other's.
      fail-fast: false
      matrix:
        include:
          - host: asus
            # The flake output stays the laptop's selector; nothing else reads
            # it.
            version: .#kernelVersion
            tag_prefix: kernel-
            tag_re: ^kernel-[0-9]
            nvidia: .#nixosConfigurations.asus.config.hardware.nvidia.package.open
            asserts: .github/kernel-asserts/asus.txt
          - host: homelab
            # No selector output: the LTS series is named in the host file, so
            # the version is asked of the kernel the flake evaluates.
            version: .#nixosConfigurations.homelab.config.boot.kernelPackages.kernel.version
            tag_prefix: kernel-homelab-
            tag_re: ^kernel-homelab-
            nvidia: ""
            asserts: .github/kernel-asserts/homelab.txt
    env:
      KERNEL: .#nixosConfigurations.${{ matrix.host }}.config.boot.kernelPackages.kernel
      NVIDIA: ${{ matrix.nvidia }}
      TAG_PREFIX: ${{ matrix.tag_prefix }}
      TAG_RE: ${{ matrix.tag_re }}
      VERSION_EXPR: ${{ matrix.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(nix eval --raw "$VERSION_EXPR")
          TAG="$TAG_PREFIX$VER"

          # Paths come from the derivation, which costs seconds. Building them
          # costs hours. These are the only paths this leg must publish; the
          # rest of the closure comes along because a cache cannot be partial,
          # but nothing else ever asks a machine to trust it.
          nix eval --json --apply 'k: [ k.out k.modules k.dev k.configfile ]' "$KERNEL" \
            | jq -r '.[]' > ./published-paths
          if [ -n "$NVIDIA" ]; then
            nix eval --json --apply 'n: [ n ]' "$NVIDIA" | jq -r '.[]' >> ./published-paths
          fi

          # PACKAGED is uploaded last, so its presence means every nar and
          # narinfo in the release made it, and its content is the path list it
          # was built for. The planned list has to be a subset of it: equal is
          # the normal case, a planned path the manifest lacks means this run
          # publishes something new (the driver module, or a shorter republish),
          # and a manifest with paths this run no longer plans is harmless.
          need_build=true
          if gh release download "$TAG" --repo "$RELEASE_REPO" \
               --pattern PACKAGED --output ./PACKAGED.published --clobber 2>/dev/null; then
            missing=$(comm -23 <(sort ./published-paths) <(sort ./PACKAGED.published)) \
              || { echo "could not compare against the published manifest" >&2; exit 1; }
            if [ -z "$missing" ]; then
              need_build=false
            else
              echo "not in the published manifest yet:"
              printf '  %s\n' "$missing"
            fi
          fi

          echo "kernel $VER, host ${{ matrix.host }}, release $TAG, need_build=$need_build"
          cat ./published-paths
          {
            echo "version=$VER"
            echo "tag=$TAG"
            echo "need_build=$need_build"
          } >> "$GITHUB_OUTPUT"

      # Runs whether or not anything needs building: a symbol renamed upstream
      # is exactly what this catches, and it must not wait for the next bump. A
      # published kernel makes this a cached, seconds-long step.
      - name: Check The Kernel Config
        run: |
          set -euo pipefail
          # The generator, the NATIVE_CPU guard and the per-host assertion list
          # live in .github/check-kernel-config.sh so the daily pin check can
          # run the same thing before it opens a PR.
          nix build "$KERNEL.configfile" --out-link ./result-config
          ./.github/check-kernel-config.sh ./result-config "${{ matrix.asserts }}"

      - name: Build And Upload Nars
        if: steps.plan.outputs.need_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_SECRET_KEY: ${{ secrets.NIX_SECRET_KEY }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t PATHS < ./published-paths

          # Store path hash alone: /nix/store/<hash>-<name> gives <hash>.
          hash_of() { local h=${1#/nix/store/}; printf '%s' "${h%%-*}"; }

          targets=("$KERNEL^out" "$KERNEL^modules" "$KERNEL^dev")
          if [ -n "$NVIDIA" ]; then
            targets+=("$NVIDIA^out")
          fi
          nix build --no-link --print-out-paths "${targets[@]}" > /dev/null
          for p in "${PATHS[@]}"; do
            [ -e "$p" ] || { echo "planned path $p is missing after the build" >&2; exit 1; }
          done

          # Sign before copying: a file cache only exports signatures already
          # recorded on the path, and `nix copy` has no --secret-key-files flag.
          printf '%s' "$NIX_SECRET_KEY" > ./nix-secret-key
          chmod 600 ./nix-secret-key
          mkdir -p ./public-cache
          nix store sign --key-file ./nix-secret-key "${PATHS[@]}"
          rm -f ./nix-secret-key
          nix copy --to "file://$PWD/public-cache" "${PATHS[@]}"

          # Everything these outputs need but this run does not publish has to
          # come from somewhere else. cache.nixos.org has the whole toolchain
          # today; check the full closure here so a rev that changes that breaks
          # the build instead of leaving a machine unable to substitute.
          { for p in "${PATHS[@]}"; do nix-store -q --requisites "$p"; done; } \
            | sort -u | grep -vxF -f ./published-paths > ./upstream-refs || true
          while read -r ref; do
            nix path-info --store https://cache.nixos.org "$ref" >/dev/null 2>&1 \
              || { echo "$ref is neither published here nor on cache.nixos.org" >&2; exit 1; }
          done < ./upstream-refs
          echo "$(wc -l < ./upstream-refs) references come from cache.nixos.org"

          # Fail loudly if a path is not signed by our own key: that is exactly
          # the "cache never hits" failure mode.
          for p in "${PATHS[@]}"; do
            if ! grep -q "^Sig: $CACHE_KEY_NAME:" "./public-cache/$(hash_of "$p").narinfo"; then
              echo "narinfo for $p is not signed by $CACHE_KEY_NAME" >&2
              exit 1
            fi
          done

          # Point every published narinfo at its release asset. gh-pages holds
          # the narinfos, the nars live in the release, and this URL is the
          # bridge.
          #
          # The file store names a nar after the hash of the compressed file,
          # not the store hash, so the narinfo's URL line is the only reliable
          # source for the file name. Guessing <storehash>.nar.xz uploads
          # nothing: gh expands its own globs and dies on a name that is absent.
          ASSET_BASE="https://github.com/$RELEASE_REPO/releases/download/$TAG"
          mkdir -p ./narinfos
          nars=()
          for p in "${PATHS[@]}"; do
            h=$(hash_of "$p")
            nar=$(sed -n 's|^URL: nar/||p' "./public-cache/$h.narinfo")
            [ -f "./public-cache/nar/$nar" ] \
              || { echo "narinfo $h points at nar/$nar, which the copy did not write" >&2; exit 1; }
            nars+=("./public-cache/nar/$nar")
            sed "s|^URL: nar/|URL: $ASSET_BASE/|" "./public-cache/$h.narinfo" > "./narinfos/$h.narinfo"
            grep -q "^URL: $ASSET_BASE/$nar\$" "./narinfos/$h.narinfo" \
              || { echo "narinfo $h still points at a relative URL" >&2; exit 1; }
          done

          # Upload before anything else can fail, and upload PACKAGED last so a
          # half-finished upload never looks complete to the next run.
          gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$RELEASE_REPO" \
                 --title "Kernel ${{ steps.plan.outputs.version }} nar cache" \
                 --notes "Nar assets for the signed kernel cache at $CACHE_URL, mirrored as narinfos on gh-pages. Read by .github/workflows/compile-kernel.yml. Deleting this while a generation still runs this kernel turns its rollback into a local build."
          gh release upload "$TAG" "${nars[@]}" --repo "$RELEASE_REPO" --clobber
          gh release upload "$TAG" ./narinfos/*.narinfo --repo "$RELEASE_REPO" --clobber
          printf '%s\n' "${PATHS[@]}" > ./PACKAGED
          gh release upload "$TAG" ./PACKAGED --repo "$RELEASE_REPO" --clobber
          echo "uploaded ${#nars[@]} nars to $TAG"

      # Keeps the release storage bounded. Anything this deletes stops being
      # substitutable, so a generation still on that kernel falls back to
      # building it locally. TAG_RE is what keeps this leg from counting the
      # other host's releases against its own budget and deleting one.
      - name: Prune Old Kernel Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release list --repo "$RELEASE_REPO" --limit 100 --json tagName \
            -q '.[] | select(.tagName | test(env.TAG_RE)) | .tagName' \
            | sort -Vr | tail -n "+$((KEEP_KERNELS + 1))" > ./prune-list
          while read -r old; do
            [ -n "$old" ] || continue
            # Never prune what this run just published, even if it is older than
            # KEEP_KERNELS newer ones, which happens when republishing.
            [ "$old" = "$TAG" ] && continue
            echo "pruning $old"
            gh release delete "$old" --repo "$RELEASE_REPO" --yes --cleanup-tag
          done < ./prune-list
          echo "kept: $(gh release list --repo "$RELEASE_REPO" --limit 100 --json tagName \
            -q '[.[] | select(.tagName | test(env.TAG_RE)) | .tagName] | join(" ")')"

  # One deploy, because gh-pages is one branch and keep_files: false replaces
  # the whole site. Runs even when a leg failed: a release that finished
  # uploading must still become servable, or that host's next switch compiles.
  #
  # The steps themselves live in publish-cache.yml, because compile-hermes.yml
  # publishes the Hermes agent's closure to the same site and the site has to be
  # written by one deploy at a time. The group below is that lock, and it is
  # shared with that workflow rather than private to this one: two deploys
  # racing would leave the site missing whichever narinfos lost. The prune stays
  # in the build legs above, where the per-host budgets and the leg's own tag
  # already live. That leaves one window a shared prune would not: a leg's prune
  # can delete a release while the other workflow's deploy is reading it, which
  # fails that deploy's verification. Moving the prune into the shared job would
  # close it, at the price of reordering this pipeline, so it is not done here.
  publish:
    needs: build
    # The called workflow cannot widen its token, so the write permission for
    # the gh-pages push is declared here, on the calling job.
    permissions:
      contents: write
    if: ${{ !cancelled() }}
    concurrency:
      group: cache-publish
      cancel-in-progress: false
    uses: ./.github/workflows/publish-cache.yml
