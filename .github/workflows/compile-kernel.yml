name: "Compile Optimized Kernel"

# Builds the custom skylake kernel from this flake and publishes it as a
# Nix binary cache on gh-pages (https://duskyelf.github.io/NixBTW).
#
# Why this works (lessons from the May experiments):
# - The kernel uses a fixed -march=skylake (skylake-march.patch) instead of
#   X86_NATIVE_CPU, so a build on an AMD Actions runner is identical to one
#   on the i9 laptop. Native-CPU sniffing gave same-store-path/different-bytes
#   poison and endless local rebuilds. (Kernel 7.2 dropped the 64-bit family
#   choice from Kconfig, so the Makefile patch is the only deterministic knob.)
# - nixpkgs-fast-release is pinned by rev in flake.nix, so CI (which has no
#   lock file) resolves the exact same toolchain as the laptop.
# - All three kernel outputs (out, modules, dev) are copied. Copying only
#   `out` left the modules uncached, which is most of the compile.
# - The deploy keeps existing files. keep_files:false wiped the cache every run.
# - The trusted-public-key name must match the NIX_SECRET_KEY signer
#   (i9-kernel-cache) or the laptop silently rejects every lookup.

on:
  workflow_dispatch:
    inputs:
      # Publishes the kernel configfile instead of the kernel: seconds instead
      # of hours. Exercises signing, deploy and substitutability on their own,
      # so a publish bug never costs another full compile to discover.
      smoke_test:
        description: "Publish only the kernel configfile (no compile)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "hosts/asus/system.nix"
      - "hosts/asus/skylake-march.patch"
      - "hosts/asus/kernel-toolchain.lock"
      - "system.nix"
      - ".github/workflows/compile-kernel.yml"

permissions:
  contents: write

# One kernel at a time: a newer run cancels a superseded one, so two quick
# commits only ever build the newer kernel.
concurrency:
  group: compile-kernel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build Kernel (all outputs)
        run: |
          # Fail fast: confirm NATIVE_CPU stayed out of .config before
          # spending ~2h compiling. (The skylake tuning itself lives in
          # skylake-march.patch; a bad patch fails the build in seconds.)
          nix build '.#nixosConfigurations.asus.config.boot.kernelPackages.kernel.configfile' --out-link ./result-config
          if grep -q '^CONFIG_X86_NATIVE_CPU=y' ./result-config; then
            echo "X86_NATIVE_CPU leaked into kernel .config" >&2
            exit 1
          fi
          # --print-out-paths, never --out-link: nix appends the output name to
          # the link (result-modules-modules), so ./result-modules would not
          # exist and the copy step would have nothing to read.
          if [ "${{ inputs.smoke_test }}" = "true" ]; then
            echo "smoke test: publishing the configfile only, no kernel build" >&2
            nix build --no-link --print-out-paths \
              '.#nixosConfigurations.asus.config.boot.kernelPackages.kernel.configfile' \
              > ./kernel-paths
          else
            nix build --no-link --print-out-paths \
              '.#nixosConfigurations.asus.config.boot.kernelPackages.kernel^out' \
              '.#nixosConfigurations.asus.config.boot.kernelPackages.kernel^modules' \
              '.#nixosConfigurations.asus.config.boot.kernelPackages.kernel^dev' \
              > ./kernel-paths
          fi
          cat ./kernel-paths

      - name: Publish Signed Closure To File Cache
        env:
          NIX_SECRET_KEY: ${{ secrets.NIX_SECRET_KEY }}
        run: |
          mapfile -t PATHS < ./kernel-paths
          printf '%s' "$NIX_SECRET_KEY" > ./nix-secret-key
          chmod 600 ./nix-secret-key
          mkdir -p ./public-cache
          # Sign first: a file cache only exports signatures already recorded
          # on the path, and `nix copy` has no --secret-key-files flag.
          nix store sign --key-file ./nix-secret-key "${PATHS[@]}"
          nix copy --to "file://$PWD/public-cache" "${PATHS[@]}"
          rm -f ./nix-secret-key
          # Fail loudly if a kernel path is not signed by our own key: that is
          # exactly the "cache never hits" failure mode.
          for p in "${PATHS[@]}"; do
            h=${p#/nix/store/}
            h=${h%%-*}
            if ! grep -q '^Sig: i9-kernel-cache:' "./public-cache/$h.narinfo"; then
              echo "narinfo for $p is not signed by i9-kernel-cache" >&2
              exit 1
            fi
          done
          ls ./public-cache | head -n 20

      - name: Deploy Cache to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-cache
          publish_branch: gh-pages
          # Never wipe: each run adds new store paths, old ones stay valid
          # for older system generations.
          keep_files: true
