name: "Compile Optimized Kernel"

# Builds the custom skylake kernel from this flake and serves it to this laptop
# as a Nix binary cache, so nixos-rebuild substitutes instead of compiling.
#
# Two hosts, because the pieces have different size limits. A substituter must
# serve <cache>/<storehash>.narinfo from a fixed path prefix, which only a
# static site can do, but no git branch accepts a file over 100 MB and the nars
# run from 64 KB to 158 MB. An earlier version copied the nars into gh-pages
# and the pre-receive hook rejected the push:
#
#   gh-pages serves the narinfo files only, a few hundred KB in total. Every
#   URL line is rewritten to an absolute release URL.
#
#   GitHub releases hold the nars, as assets under the tag kernel-<version>.
#   Assets allow 2 GB per file and are free on public repos. Nix follows the
#   redirect to the storage backend: verified by pointing a cache root at a
#   release asset and watching nix copy --from download the nar from github.com,
#   and by deleting a path from the local store and substituting it back, which
#   fails without the signing key and succeeds with it.
#
# A kernel is built at most once. The release carries a PACKAGED manifest,
# uploaded last, and the plan step checks for it before spending two hours. So
# dispatching this workflow against a kernel that is already published is a
# two minute no-op, which is also how to rehearse a change to this file: the
# plan, gather, deploy and verify steps all run, nothing is compiled.
#
# A binary cache must be closed under references (nix refuses to add a path
# whose dependencies are absent), so each release carries the whole build
# closure, not just the kernel outputs, which is why one release is ~720 MB
# across ~150 assets. Most of those are the toolchain the kernel references.
#
# Retention keeps the newest KEEP_KERNELS releases. Deleting a release whose
# kernel a generation still runs turns that rollback into a local build, so the
# default leaves one spare; set it to 1 if you never roll back. Pruning never
# touches the release this run published.
#
# Which kernel gets built is never named here: hosts/asus/stable-kernel.nix
# picks the newest series with a stable patch release.
#
# Why the artifact is deterministic at all (lessons from the May experiments):
# - fixed -march=skylake (skylake-march.patch), never X86_NATIVE_CPU, so a build
#   on an AMD runner is identical to one on the i9 laptop. Native-CPU sniffing
#   gave same-store-path/different-bytes poison and endless local rebuilds.
# - nixpkgs-fast-release is pinned by rev in flake.nix, so CI resolves the exact
#   same toolchain as the laptop.
# - the trusted-public-key name must match the NIX_SECRET_KEY signer, or the
#   laptop silently rejects every lookup and builds the kernel itself.

env:
  CACHE_URL: https://duskyelf.github.io/NixBTW
  RELEASE_REPO: DuskyElf/NixBTW
  # The signer name. system.nix holds the public half the laptop trusts; the
  # name there and here must be identical, so keep them in one place each.
  CACHE_KEY_NAME: i9-kernel-cache
  # Kernel releases to keep. Each one is ~720 MB of release assets.
  KEEP_KERNELS: 2
  # Long enough that repeating it by hand invites a typo in one of the outputs.
  KERNEL: .#nixosConfigurations.asus.config.boot.kernelPackages.kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      # The selector: editing it changes which kernel is built, so it has to
      # trigger a rebuild or the laptop compiles the new one locally.
      - "hosts/asus/stable-kernel.nix"
      - "hosts/asus/system.nix"
      - "hosts/asus/skylake-march.patch"
      - "hosts/asus/kernel-toolchain.lock"
      - "system.nix"
      - ".github/workflows/compile-kernel.yml"

permissions:
  contents: write

# One kernel at a time: a newer run cancels a superseded one, so two quick
# commits only ever build the newer kernel.
concurrency:
  group: compile-kernel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(nix eval --raw .#kernelVersion)
          TAG="kernel-$VER"

          # Paths come from the derivation, which costs seconds. Building them
          # costs hours. These are the only paths this workflow must publish;
          # the rest of the closure comes along because a cache cannot be
          # partial, but nothing else ever asks the laptop to trust it.
          nix eval --json --apply 'k: [ k.out k.modules k.dev k.configfile ]' "$KERNEL" \
            | jq -r '.[]' > ./published-paths

          # PACKAGED is uploaded last, so its presence means every nar and
          # narinfo in the release made it. Anything less and we build again.
          need_build=true
          if gh release view "$TAG" --repo "$RELEASE_REPO" --json assets \
               -q '.assets[].name' 2>/dev/null | grep -qx PACKAGED; then
            need_build=false
          fi

          echo "kernel $VER, release $TAG, need_build=$need_build"
          cat ./published-paths
          {
            echo "version=$VER"
            echo "tag=$TAG"
            echo "need_build=$need_build"
          } >> "$GITHUB_OUTPUT"

      - name: Build And Upload Nars
        if: steps.plan.outputs.need_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_SECRET_KEY: ${{ secrets.NIX_SECRET_KEY }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t PATHS < ./published-paths

          # Fail fast: keep NATIVE_CPU out of .config before spending ~2h. The
          # skylake tuning itself lives in skylake-march.patch, so a bad patch
          # fails the build in seconds.
          nix build "$KERNEL.configfile" --out-link ./result-config
          if grep -q '^CONFIG_X86_NATIVE_CPU=y' ./result-config; then
            echo "X86_NATIVE_CPU leaked into kernel .config" >&2
            exit 1
          fi
          nix build --no-link --print-out-paths \
            "$KERNEL^out" "$KERNEL^modules" "$KERNEL^dev" > /dev/null
          for p in "${PATHS[@]}"; do
            [ -e "$p" ] || { echo "planned path $p is missing after the build" >&2; exit 1; }
          done

          # Sign before copying: a file cache only exports signatures already
          # recorded on the path, and `nix copy` has no --secret-key-files flag.
          printf '%s' "$NIX_SECRET_KEY" > ./nix-secret-key
          chmod 600 ./nix-secret-key
          mkdir -p ./public-cache
          nix store sign --key-file ./nix-secret-key "${PATHS[@]}"
          rm -f ./nix-secret-key
          nix copy --to "file://$PWD/public-cache" "${PATHS[@]}"

          # Fail loudly if a path is not signed by our own key: that is exactly
          # the "cache never hits" failure mode. Per path, and by signer name,
          # because dependencies arrive signed by cache.nixos.org and a bare
          # `grep -L '^Sig:'` could never fail.
          for p in "${PATHS[@]}"; do
            h=${p#/nix/store/}
            h=${h%%-*}
            if ! grep -q "^Sig: $CACHE_KEY_NAME:" "./public-cache/$h.narinfo"; then
              echo "narinfo for $p is not signed by $CACHE_KEY_NAME" >&2
              exit 1
            fi
          done

          # Point every narinfo at its release asset. gh-pages holds the
          # narinfos, the nars live in the release, and this URL is the bridge.
          ASSET_BASE="https://github.com/$RELEASE_REPO/releases/download/$TAG"
          mkdir -p ./narinfos
          for n in ./public-cache/*.narinfo; do
            out="./narinfos/$(basename "$n")"
            sed "s|^URL: nar/|URL: $ASSET_BASE/|" "$n" > "$out"
            grep -q "^URL: $ASSET_BASE/" "$out" \
              || { echo "narinfo $n still points at a relative URL" >&2; exit 1; }
          done

          # Upload before anything else can fail, and upload PACKAGED last so a
          # half-finished upload never looks complete to the next run.
          gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$RELEASE_REPO" \
                 --title "Kernel ${{ steps.plan.outputs.version }} nar cache" \
                 --notes "Nar assets for the signed kernel cache at $CACHE_URL, mirrored as narinfos on gh-pages. Read by .github/workflows/compile-kernel.yml. Deleting this while a generation still runs this kernel turns its rollback into a local build."
          gh release upload "$TAG" ./public-cache/nar/*.nar.xz --repo "$RELEASE_REPO" --clobber
          gh release upload "$TAG" ./narinfos/*.narinfo --repo "$RELEASE_REPO" --clobber
          printf '%s\n' "${PATHS[@]}" > ./PACKAGED
          gh release upload "$TAG" ./PACKAGED --repo "$RELEASE_REPO" --clobber
          echo "uploaded $(find ./public-cache/nar -name '*.nar.xz' | wc -l) nars to $TAG"

      # Keeps the release storage bounded. Anything this deletes stops being
      # substitutable, so a generation still on that kernel falls back to
      # building it locally.
      - name: Prune Old Kernel Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release list --repo "$RELEASE_REPO" --limit 100 --json tagName \
            -q '.[] | select(.tagName | startswith("kernel-")) | .tagName' \
            | sort -Vr | tail -n "+$((KEEP_KERNELS + 1))" > ./prune-list
          while read -r old; do
            [ -n "$old" ] || continue
            # Never prune what this run just published, even if it is older than
            # KEEP_KERNELS newer ones, which happens when republishing.
            [ "$old" = "$TAG" ] && continue
            echo "pruning $old"
            gh release delete "$old" --repo "$RELEASE_REPO" --yes --cleanup-tag
          done < ./prune-list
          echo "kept: $(gh release list --repo "$RELEASE_REPO" --limit 100 --json tagName \
            -q '[.[] | select(.tagName | startswith("kernel-")) | .tagName] | join(" ")')"

      # gh-pages is rebuilt from the surviving releases every run rather than
      # appended to, so a narinfo can never outlive the nar it points at. The
      # download order is oldest first, so when two releases carry the same
      # dependency the newest one wins and survives the next prune.
      - name: Gather Narinfos From Every Kernel Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf ./narinfos
          mkdir -p ./narinfos
          gh release list --repo "$RELEASE_REPO" --limit 100 --json tagName \
            -q '.[] | select(.tagName | startswith("kernel-")) | .tagName' \
            | sort -V > ./kept-releases
          while read -r tag; do
            [ -n "$tag" ] || continue
            gh release download "$tag" --repo "$RELEASE_REPO" \
              --pattern '*.narinfo' --dir ./narinfos --clobber
          done < ./kept-releases
          COUNT=$(find ./narinfos -name '*.narinfo' | wc -l)
          [ "$COUNT" -gt 0 ] || { echo "no narinfos in any kernel release" >&2; exit 1; }
          echo "$COUNT narinfos from $(wc -l < ./kept-releases) release(s)"

      - name: Deploy Narinfos To GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./narinfos
          publish_branch: gh-pages
          # Explicit, because replacing the whole site is the point: gh-pages
          # must mirror the surviving releases exactly. Appending would let a
          # narinfo outlive the nar it points at after a prune, and a narinfo
          # whose nar is gone makes nix error instead of falling back.
          keep_files: false

      # Proves the laptop's substituter can actually use the cache: the narinfo
      # is served, describes the path we published, carries our signature, and
      # the nar it points at is downloadable with the size the narinfo promises.
      # The size check is a HEAD, so a 158 MB nar costs nothing to verify.
      - name: Verify The Cache Serves Every Path
        run: |
          set -uo pipefail

          # Returns non-zero and sets REASON when the path is not servable yet.
          check_path() {
            p=$1
            h=$2
            REASON=""
            served=$(curl -fsS "$CACHE_URL/$h.narinfo" 2>/dev/null) \
              || { REASON="narinfo not served"; return 1; }
            printf '%s\n' "$served" | grep -qx "StorePath: $p" \
              || { REASON="served narinfo does not describe $p"; return 1; }
            printf '%s\n' "$served" | grep -q "^Sig: $CACHE_KEY_NAME:" \
              || { REASON="not signed by $CACHE_KEY_NAME"; return 1; }
            url=$(printf '%s\n' "$served" | sed -n 's/^URL: //p')
            size=$(printf '%s\n' "$served" | sed -n 's/^FileSize: //p')
            [ -n "$url" ] && [ -n "$size" ] \
              || { REASON="narinfo has no URL or FileSize"; return 1; }
            headers=$(curl -fsSIL "$url" 2>/dev/null | tr -d '\r') \
              || { REASON="nar not downloadable: $url"; return 1; }
            code=$(printf '%s\n' "$headers" | awk '/^HTTP\//{c=$2} END{print c}')
            actual=$(printf '%s\n' "$headers" | awk 'tolower($1)=="content-length:"{v=$2} END{print v}')
            [ "$code" = "200" ] || { REASON="nar returned $code"; return 1; }
            [ "$actual" = "$size" ] \
              || { REASON="nar is $actual bytes, narinfo says $size"; return 1; }
            echo "$p -> $url ($size bytes)"
          }

          mapfile -t PATHS < ./published-paths
          for p in "${PATHS[@]}"; do
            h=${p#/nix/store/}
            h=${h%%-*}
            # Pages serves max-age=600 and switches over seconds after the
            # deploy step reports success, so the narinfo can be present but
            # still the previous copy. Retry until the content is right, not
            # until it merely loads: a stale narinfo is the failure that made
            # a smoke test look broken when the cache was already fine.
            ok=false
            for attempt in $(seq 1 60); do
              if check_path "$p" "$h"; then ok=true; break; fi
              echo "attempt $attempt/60: $h ($REASON), retrying in 10s" >&2
              sleep 10
            done
            [ "$ok" = "true" ] || { echo "$p never became servable: $REASON" >&2; exit 1; }
          done
          echo "all ${#PATHS[@]} paths are served, signed and downloadable"
