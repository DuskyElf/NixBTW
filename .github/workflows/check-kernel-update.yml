name: "Check Kernel Update"

# Daily: if the channel (CHANNEL below) carries a newer stable kernel than our
# pin, stage the flake.nix bump on the kernel-bump branch and open or update a
# PR to main.
#
# "Stable kernel" means the newest series with a stable patch release, as
# decided by hosts/asus/stable-kernel.nix. Comparing versions rather than
# series names is what turns a new series (7.3.1, later 7.4.1) into an
# ordinary pin bump instead of an edit to the kernel selection.
#
# Nothing lands on main by itself: merging the PR is the manual gate.
# The merge triggers compile-kernel (path filter), which deploys the signed
# binary to gh-pages; the next local nixos-rebuild substitutes it.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-kernel-update

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The channel the kernel toolchain pin tracks. If this branch ever stops
      # carrying new stable series, point it (and the flake.nix URL) at
      # nixos-unstable; nothing else here assumes a release branch.
      CHANNEL: release-26.05
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Compare Channel Kernel With Pinned Kernel
        id: check
        run: |
          set -euo pipefail
          PINNED_REV=$(grep -oP 'nixpkgs-fast-release\.url = "github:NixOS/nixpkgs/\K[0-9a-f]{40}' flake.nix)
          [ -n "$PINNED_REV" ] || { echo "pin not found in flake.nix" >&2; exit 1; }
          echo "pinned rev: $PINNED_REV"
          # Handed to the bump step so the regex lives in one place.
          echo "pinned_rev=$PINNED_REV" >> "$GITHUB_OUTPUT"

          PREFETCH=$(nix flake prefetch "github:NixOS/nixpkgs/$CHANNEL" --json)
          LATEST_REV=$(echo "$PREFETCH" | jq -r '.locked.rev // .rev')
          [ -n "$LATEST_REV" ] && [ "$LATEST_REV" != "null" ] || { echo "could not resolve channel rev" >&2; exit 1; }
          echo "latest rev: $LATEST_REV"

          ver_at() {
            # Ask the flake itself which kernel a rev yields, so the selection
            # rule (hosts/asus/stable-kernel.nix) is never duplicated here.
            nix eval --raw .#kernelVersion --override-input nixpkgs-fast-release "github:NixOS/nixpkgs/$1"
          }
          # The pinned side is the flake as committed: this is also a check that
          # the rev grepped above is the rev that actually resolves.
          PINNED_VER=$(nix eval --raw .#kernelVersion)
          LATEST_VER=$(ver_at "$LATEST_REV")
          echo "pinned kernel: $PINNED_VER, channel kernel: $LATEST_VER"

          if [ "$PINNED_VER" = "$LATEST_VER" ]; then
            echo "kernel $PINNED_VER still current, nothing to do"
            exit 0
          fi
          # Forward-only. Normally the pin trails the channel and the check
          # above only fires on a real move, but a hand-picked staging rev can
          # sit ahead of it for days. Never stage a downgrade.
          if [ "$(printf '%s\n%s\n' "$PINNED_VER" "$LATEST_VER" | sort -V | head -n1)" = "$LATEST_VER" ]; then
            echo "pinned $PINNED_VER ahead of channel $LATEST_VER, holding"
            exit 0
          fi
          echo "new kernel available: $PINNED_VER -> $LATEST_VER"
          {
            echo "new_version=$LATEST_VER"
            echo "new_rev=$LATEST_REV"
            echo "old_version=$PINNED_VER"
          } >> "$GITHUB_OUTPUT"

      - name: Stage Toolchain Bump PR
        if: steps.check.outputs.new_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED_REV: ${{ steps.check.outputs.pinned_rev }}
          NEW_REV: ${{ steps.check.outputs.new_rev }}
          NEW_VER: ${{ steps.check.outputs.new_version }}
          OLD_VER: ${{ steps.check.outputs.old_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B kernel-bump

          sed -i "s/${PINNED_REV}/${NEW_REV}/" flake.nix
          # Caution: the pin must be the ONLY thing sed touched.
          CHANGED=$(git diff --numstat flake.nix | awk '{print $1 + $2}')
          [ "$CHANGED" = "2" ] || { echo "pin replacement touched $CHANGED lines, aborting" >&2; git diff flake.nix >&2; exit 1; }

          git add flake.nix
          git commit -m "chore(kernel): stage toolchain for linux ${OLD_VER} -> ${NEW_VER}" || echo "nothing new to commit"
          # Forced because the branch is a bot-owned staging area: a re-bump
          # replaces the previous one rather than stacking on it.
          git push -f origin kernel-bump

          TITLE="chore(kernel): build linux ${NEW_VER}"
          BODY="${CHANNEL} moved the stable kernel ${OLD_VER} -> ${NEW_VER}.

          Merging this PR triggers the compile-kernel build; once CI deploys
          the binary to gh-pages, run nixos-rebuild locally (cache hit, no
          2h compile) and reboot."
          if gh pr view kernel-bump --json number -q .number >/dev/null 2>&1; then
            # Re-bumps move the branch, so the title and body have to follow or
            # the PR keeps advertising the kernel it was first opened for.
            gh pr edit kernel-bump --title "$TITLE" --body "$BODY"
          else
            # Requesting review guarantees a GitHub notification for the merge gate.
            gh pr create --base main --head kernel-bump --reviewer DuskyElf \
              --title "$TITLE" --body "$BODY"
          fi
