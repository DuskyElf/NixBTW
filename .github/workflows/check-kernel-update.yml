name: "Check Kernel Update"

# Daily: if any host's kernel in the channel (CHANNEL below) is newer than the
# pin, stage the flake.nix bump on the kernel-bump branch and open or update a
# PR to main.
#
# One pin moves every kernel in the repo, but the hosts do not track the same
# series: the laptop follows the newest stable series, the homelab names the
# LTS one. So each host's version is compared, and a bump is a bump when any of
# them moved. A host that would go backwards holds the whole pin instead,
# because one rev moves both kernels and a forward bump for one would be a
# downgrade for the other. The PR lists the hosts that moved and their
# versions, because "the stable kernel went up" is not the whole diff: a
# homelab-only LTS patch is still a kernel CI has to rebuild.
#
# The versions come from the flake's kernelVersions output, which evaluates
# each host's configuration, so this job needs both machines to evaluate: a tip
# that will not evaluate fails this run, before the merge, instead of before a
# switch after it. An unrelated eval break does the same, since the flake's
# other inputs are unlocked too.
#
# On the laptop, "stable kernel" means the newest series with a stable patch
# release, as decided by hosts/asus/stable-kernel.nix. Comparing versions
# rather than series names is what turns a new series (7.3.1, later 7.4.1)
# into an ordinary pin bump instead of an edit to the kernel selection.
#
# Nothing lands on main by itself: merging the PR is the only manual gate.
# The merge triggers compile-kernel (path filter), which uploads the nars to a
# GitHub release and deploys the narinfos to gh-pages; the next daily run pulls
# the merge and its system switch substitutes the binary instead of compiling
# for two hours. Nothing reboots, so the new kernel is the boot default after
# that switch and runs from the next reboot.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-kernel-update

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The channel the kernel toolchain pin tracks. If this branch ever stops
      # carrying new stable series, point it (and the flake.nix URL) at
      # nixos-unstable; nothing else here assumes a release branch.
      CHANNEL: release-26.05
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Seconds, no nix eval. A wrong answer in the step below is silent (no
      # PR, or a staged downgrade), so it is rehearsed against fixtures first.
      - name: Rehearse The Compare Step
        run: ./.github/test-kernel-compare.sh

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Compare Channel Kernels With Pinned Kernels
        id: check
        env:
          # Outside the checkout: the file carries nothing to commit, and a
          # stray `git add -A` cannot pick it up.
          CHANGES: ${{ runner.temp }}/kernel-changes
        run: |
          set -euo pipefail
          PINNED_REV=$(grep -oP 'nixpkgs-fast-release\.url = "github:NixOS/nixpkgs/\K[0-9a-f]{40}' flake.nix)
          [ -n "$PINNED_REV" ] || { echo "pin not found in flake.nix" >&2; exit 1; }
          echo "pinned rev: $PINNED_REV"
          # Handed to the bump step so the regex lives in one place.
          echo "pinned_rev=$PINNED_REV" >> "$GITHUB_OUTPUT"

          PREFETCH=$(nix flake prefetch "github:NixOS/nixpkgs/$CHANNEL" --json)
          LATEST_REV=$(echo "$PREFETCH" | jq -r '.locked.rev // .rev')
          [ -n "$LATEST_REV" ] && [ "$LATEST_REV" != "null" ] || { echo "could not resolve channel rev" >&2; exit 1; }
          echo "latest rev: $LATEST_REV"

          # One eval per side, every host at once: the flake answers which
          # kernel each machine runs, so the selection rule is never duplicated
          # here and a new host is compared without an edit. It is not covered
          # end to end until .github/kernel-asserts/<host>.txt exists and
          # compile-kernel.yml's matrix names it, and the step below fails on
          # the first of those. The pinned side is the flake as committed, which
          # is also a check that the rev grepped above is the rev that resolves.
          PINNED=$(nix eval --json .#kernelVersions)
          LATEST=$(nix eval --json .#kernelVersions \
            --override-input nixpkgs-fast-release "github:NixOS/nixpkgs/$LATEST_REV")
          HOSTS=$(echo "$PINNED" | jq -r 'keys|join(" ")')
          # An empty answer is a broken output, not a machine with no kernels:
          # without this, every loop below runs zero times and the job is green
          # with no PR, which is the failure this workflow exists to avoid.
          [ -n "$HOSTS" ] || { echo "kernelVersions returned no hosts" >&2; exit 1; }
          echo "hosts: $HOSTS"

          # Every host has to be answerable on both sides before anything is
          # written. A run that cannot compare one host stages nothing, rather
          # than a bump for the hosts it could read.
          version() {
            echo "$1" | jq -r --arg h "$2" '.[$h] // empty'
          }
          for host in $HOSTS; do
            [ -n "$(version "$PINNED" "$host")" ] \
              || { echo "the pinned flake has no kernel version for $host" >&2; exit 1; }
            [ -n "$(version "$LATEST" "$host")" ] \
              || { echo "the channel flake has no kernel version for $host" >&2; exit 1; }
          done

          # host old new, one line per host that moved forward. Collected, not
          # written: a hold and a no-op must leave $CHANGES untouched.
          moved=()
          held=
          for host in $HOSTS; do
            old=$(version "$PINNED" "$host")
            new=$(version "$LATEST" "$host")
            if [ "$old" = "$new" ]; then
              echo "$host: $old, unchanged"
              continue
            fi
            # Forward-only. Normally the pin trails the channel and only a real
            # move gets here, but a hand-picked staging rev can sit ahead of it
            # for days. Never stage a downgrade of any host: the pin is one rev,
            # so moving it forward for one kernel would move the other back.
            if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | head -n1)" = "$new" ]; then
              echo "$host: pinned $old ahead of channel $new, holding"
              held=1
              continue
            fi
            echo "$host: $old -> $new"
            moved+=("$host $old $new")
          done
          if [ -n "$held" ]; then
            echo "pin is ahead of the channel for at least one host, holding"
            exit 0
          fi
          if [ "${#moved[@]}" -eq 0 ]; then
            echo "kernels still current, nothing to do"
            exit 0
          fi
          printf '%s\n' "${moved[@]}" > "$CHANGES"
          echo "new_rev=$LATEST_REV" >> "$GITHUB_OUTPUT"
          echo "hosts=$HOSTS" >> "$GITHUB_OUTPUT"

      # The PR is the manual gate, so the gate should arrive green: a rev that
      # renames a symbol a host's trim sets must fail here, not on main after
      # the merge with the homelab sitting on its old generation.
      - name: Check Every Kernel Against The Candidate
        if: steps.check.outputs.new_rev != ''
        env:
          NEW_REV: ${{ steps.check.outputs.new_rev }}
          HOSTS: ${{ steps.check.outputs.hosts }}
        run: |
          set -euo pipefail
          for host in $HOSTS; do
            nix build --out-link "./result-$host" \
              ".#nixosConfigurations.$host.config.boot.kernelPackages.kernel.configfile" \
              --override-input nixpkgs-fast-release "github:NixOS/nixpkgs/$NEW_REV"
            ./.github/check-kernel-config.sh "./result-$host" ".github/kernel-asserts/$host.txt"
          done

      - name: Stage Toolchain Bump PR
        if: steps.check.outputs.new_rev != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED_REV: ${{ steps.check.outputs.pinned_rev }}
          NEW_REV: ${{ steps.check.outputs.new_rev }}
          CHANGES: ${{ runner.temp }}/kernel-changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B kernel-bump

          sed -i "s/${PINNED_REV}/${NEW_REV}/" flake.nix
          # Caution: the pin must be the ONLY thing sed touched.
          CHANGED=$(git diff --numstat flake.nix | awk '{print $1 + $2}')
          [ "$CHANGED" = "2" ] || { echo "pin replacement touched $CHANGED lines, aborting" >&2; git diff flake.nix >&2; exit 1; }

          # The wording lives in .github/kernel-bump-message.sh, where the
          # test can reach it. The commit subject and the PR title are one
          # string, so a bump cannot name one host in git and another on GitHub.
          TITLE=$(.github/kernel-bump-message.sh title "$CHANGES")
          BODY=$(.github/kernel-bump-message.sh body "$CHANGES")

          git add flake.nix
          # No fallback on failure: new_rev only exists because the pin line
          # changed, so a commit that cannot happen is a broken run, not a
          # re-bump of the same rev. Pushing anyway would advertise a bump the
          # branch does not carry.
          git commit -m "$TITLE"
          # Forced because the branch is a bot-owned staging area: a re-bump
          # replaces the previous one rather than stacking on it.
          git push -f origin kernel-bump

          # Only an OPEN PR may be edited. gh resolves a head branch whatever its
          # state, so the merged PR from an earlier bump still answers to
          # kernel-bump; editing it renames a dead PR and leaves this bump with
          # no PR at all.
          OPEN_PR=$(gh pr list --head kernel-bump --state open --json number -q '.[0].number' || true)
          if [ -n "$OPEN_PR" ]; then
            # Re-bumps move the branch, so the title and body have to follow or
            # the PR keeps advertising the kernel it was first opened for.
            gh pr edit "$OPEN_PR" --title "$TITLE" --body "$BODY"
          else
            # The previous bump's PR is merged or closed: this push to the
            # staging branch is a fresh diff against main, so open a new PR.
            # Requesting review guarantees a notification for the merge gate.
            gh pr create --base main --head kernel-bump --reviewer DuskyElf \
              --title "$TITLE" --body "$BODY"
          fi
